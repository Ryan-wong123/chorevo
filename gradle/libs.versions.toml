[versions]
agp = "8.13.2"                 # Android Gradle Plugin version
firebaseBom = "33.7.0"        # Firebase BOM (aligns all Firebase library versions)
kotlin = "2.0.21"             # Kotlin language version
coreKtx = "1.17.0"            # Android core-ktx version
junit = "4.13.2"              # JUnit unit testing framework
junitVersion = "1.3.0"        # AndroidX JUnit extension version
espressoCore = "3.7.0"        # Espresso UI testing framework
lifecycleRuntimeKtx = "2.10.0" # Lifecycle runtime with coroutine support
activityCompose = "1.12.2"    # Activity integration for Jetpack Compose
composeBom = "2024.09.00"     # Compose BOM for consistent Compose versions
room = "2.6.1"                # Room database version
ksp = "2.0.21-1.0.27"         # Kotlin Symbol Processing plugin version
hilt = "2.57.1"
androidxHilt = "1.3.0"
camerax = "1.5.0"             # CameraX library version
mediapipeTasks = "0.10.26.1"  # MediaPipe Vision Tasks version
tensorflowLite = "2.17.0"     # TensorFlow Lite runtime; minSdk 19, compatible with app minSdk 26
lifecycle = "2.8.6"           # Lifecycle libraries (Compose ViewModel, runtime)
media3 = "1.9.2"              # Media3 / ExoPlayer version
work = "2.9.0"
runtime = "1.10.3"            # WorkManager version
navigationCompose = "2.7.7"   # Jetpack Navigation for Compose
coilCompose = "2.5.0"         # Coil Image Loading Library (Compose integration)
mockk = "1.13.12"
coroutinesTest = "1.8.1"
playServicesTasks = "18.2.0"
codeScanner = "16.1.0"        # Google code scanner (QR invites; no camera permission)
zxing = "3.5.3"               # QR code generation

turbine = "1.1.0"

datastore = "1.1.1"
firebaseAppCheck = "18.0.0"
credentials = "1.3.0"
googleId = "1.1.1"

androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
monitor = "1.7.2"
lifecycleViewmodelKtx = "2.10.0"

[libraries]
# Kotlin extensions for core Android APIs
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Firebase Analytics SDK (version controlled by BOM)
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

# Firebase Bill of Materials (aligns all Firebase libs)
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }

# Standard unit testing framework
junit = { group = "junit", name = "junit", version.ref = "junit" }

# Android-specific JUnit extension
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }

# Espresso UI testing framework
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Lifecycle runtime with coroutine support
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }

# Enables Compose inside Activity (setContent{})
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose BOM for version alignment
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# Core Compose UI framework
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }

# Graphics and drawing APIs
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }

# Compose debugging tools
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

# Enables @Preview annotation
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

# Required for Compose UI tests
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Compose UI testing framework
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# Material 3 design components
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Room database runtime engine
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }

# Annotation processor for generating DAO code
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Coroutine + Flow support for Room
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# Core CameraX API
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }

# Camera2 implementation backend
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }

# Lifecycle-aware camera binding
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }

# PreviewView UI component
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# Device-specific camera extensions (HDR, Night mode)
androidx-camera-extensions = { group = "androidx.camera", name = "camera-extensions", version.ref = "camerax" }

# Background task scheduling with coroutine support
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# On-device ML vision tasks (pose, face, gesture detection)
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipeTasks" }
tensorflow-lite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflowLite" }

# Lifecycle integration for Compose
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Allows viewModel() inside Composables
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Firebase Authentication (email, Google, etc.)
firebase-auth = { module = "com.google.firebase:firebase-auth-ktx" }

# Firebase Cloud Firestore database
firebase-firestore = { module = "com.google.firebase:firebase-firestore-ktx" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

# Firebase Cloud Storage (files, videos, images)
firebase-storage = { group = "com.google.firebase", name = "firebase-storage" }

# Enables .await() on Firebase / Play Services tasks
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version = "1.9.0" }

# Video playback engine
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }

# Video player UI components
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Extended Material icon set
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtime" }

# AndroidX Navigation Compose dependency
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Coil Compose dependency
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coilCompose" }

# ---- Unit test libs ----
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
play-services-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "codeScanner" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
play-services-tasks = { module = "com.google.android.gms:play-services-tasks", version.ref = "playServicesTasks" }

# ---- Android instrumentation test libs ----
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
androidx-monitor = { group = "androidx.test", name = "monitor", version.ref = "monitor" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
firebase-appcheck-debug = { module = "com.google.firebase:firebase-appcheck-debug", version.ref = "firebaseAppCheck" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleId" }
androidx-media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }

androidx-media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }

androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

androidx-media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }

androidx-media3-database = { module = "androidx.media3:media3-database", version.ref = "media3" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }

[plugins]
# Android application plugin
android-application = { id = "com.android.application", version.ref = "agp" }

# Kotlin Android plugin
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

# Compose compiler plugin for Kotlin
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Kotlin Symbol Processing plugin (used by Room)
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Required for Firebase configuration (google-services.json)
google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
