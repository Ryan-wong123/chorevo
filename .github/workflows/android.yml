name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The default also installs the legacy "tools" package, which the
          # SDK no longer ships, so sdkmanager fails. Gradle fetches the rest.
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest --no-daemon

  integration-tests:
    name: Integration tests (androidTest on emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [unit-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Matches your working instrumented-tests.yml
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Matches your working instrumented-tests.yml (helps emulator on ubuntu runners)
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator's userdata partition no longer fits on a stock runner,
      # so drop large toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Run instrumentation tests (connectedDebugAndroidTest)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_5
          emulator-boot-timeout: 300
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -no-metrics
          script: ./gradlew --stacktrace connectedDebugAndroidTest --no-daemon

      # Reports are only needed to debug failures. Uploads never fail the build
      # (e.g. when the account's artifact storage quota is full).
      - name: Upload instrumented test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        continue-on-error: true
        with:
          name: instrumented-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          retention-days: 3

  build:
    name: Build (assemble)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, integration-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The default also installs the legacy "tools" package, which the
          # SDK no longer ships, so sdkmanager fails. Gradle fetches the rest.
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Release signing: only when the upload key is in the repo secrets
      # (RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS,
      # RELEASE_KEY_PASSWORD; see SECURITY.md). Otherwise the release build is
      # unsigned. The keystore is written outside the checkout and deleted after.
      - name: Prepare release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No release signing secrets; the release APK will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
            echo "CHOREVO_KEYSTORE_FILE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble Debug + Release
        env:
          CHOREVO_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CHOREVO_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CHOREVO_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          TASKS="assembleDebug assembleRelease"
          # A signed App Bundle (.aab) for uploading to Google Play.
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then TASKS="$TASKS bundleRelease"; fi
          ./gradlew --stacktrace $TASKS --no-daemon

      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chorevo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload release APK
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chorevo-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload release App Bundle
        if: steps.signing.outputs.signed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chorevo-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 3
