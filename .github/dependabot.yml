# Weekly dependency updates, grouped so each week brings at most one PR per
# group instead of one per library. Kotlin, KSP, Compose compiler and Hilt must
# move together, so they share a group.
#
# Every ecosystem checks only on Monday 09:00 Singapore time. Open Dependabot
# PRs are not rebased when main changes (rebase-strategy: disabled); comment
# "@dependabot rebase" on one to bring it up to date. Security fixes for known
# vulnerabilities are separate and can arrive any day.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    rebase-strategy: disabled
    # Hilt 2.59+ and AGP 9 need a deliberate Android Gradle Plugin 9 upgrade
    # (new DSL); don't propose them in the weekly batch.
    ignore:
      - dependency-name: "com.google.dagger*"
        versions: [">= 2.59"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
    groups:
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.google.dagger*"
          - "androidx.room*"
      android-libraries:
        patterns: ["*"]
        exclude-patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.google.dagger*"
          - "androidx.room*"

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    rebase-strategy: disabled
    groups:
      functions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /rules-tests
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    rebase-strategy: disabled
    groups:
      rules-tests:
        patterns: ["*"]
