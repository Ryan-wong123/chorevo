<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chorevo – Dance with me</title>

    <!-- Link previews in WhatsApp, Instagram, Facebook, Telegram, X, etc. -->
    <meta name="description" content="Watch this dance and practise it with real-time pose feedback on Chorevo.">
    <meta property="og:type" content="video.other">
    <meta property="og:site_name" content="Chorevo">
    <meta property="og:title" content="Check out this dance on Chorevo">
    <meta property="og:description" content="Watch this dance and practise it with real-time pose feedback on Chorevo.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Check out this dance on Chorevo">
    <meta name="twitter:description" content="Watch this dance and practise it with real-time pose feedback on Chorevo.">

    <style>
      :root { --accent: #ff3d6e; --bg: #0f0f14; --card: #1b1b24; --text: #f5f5f7; --muted: #a0a0ad; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: var(--bg); color: var(--text); font-family: Roboto, -apple-system, Helvetica, Arial, sans-serif; padding: 16px; }
      .card { width: 100%; max-width: 380px; background: var(--card); border-radius: 20px; padding: 32px 24px; text-align: center; }
      .logo { font-size: 28px; font-weight: 800; letter-spacing: .5px; margin: 0 0 8px; }
      .logo span { color: var(--accent); }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      .btn { display: block; width: 100%; padding: 14px; border-radius: 999px; border: 0; font-size: 16px; font-weight: 600;
             text-decoration: none; cursor: pointer; margin-bottom: 12px; }
      .primary { background: var(--accent); color: #fff; }
      .secondary { background: transparent; color: var(--text); border: 1px solid #3a3a48; }
      .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; min-height: 1em; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="logo">Chor<span>evo</span></h1>
      <p>Someone shared a dance with you. Open it in the Chorevo app to watch and practise along.</p>
      <a id="open" class="btn primary" href="#">Open in Chorevo</a>
      <button id="copy" class="btn secondary" type="button">Copy link</button>
      <p id="hint" class="hint"></p>
    </main>

    <script>
      (function () {
        var ANDROID_PACKAGE = 'com.example.chorevo';

        // /dance/<id>  →  <id>
        var match = location.pathname.match(/^\/dance\/([^\/?#]+)/);
        var danceId = match ? match[1] : '';
        var params = new URLSearchParams(location.search);
        var isAndroid = /android/i.test(navigator.userAgent);

        var schemeUrl = 'chorevo://dance/' + danceId;
        var fallback = location.origin + location.pathname + '?app=missing';
        var intentUrl = 'intent://dance/' + danceId +
          '#Intent;scheme=chorevo;package=' + ANDROID_PACKAGE +
          ';S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';

        var openBtn = document.getElementById('open');
        var hint = document.getElementById('hint');
        openBtn.href = isAndroid ? intentUrl : schemeUrl;

        if (!danceId) {
          hint.textContent = 'This link looks incomplete.';
          openBtn.style.display = 'none';
        } else if (params.get('app') === 'missing') {
          hint.textContent = 'Chorevo isn’t installed on this device yet.';
        } else if (isAndroid) {
          // Try to jump straight into the app, like TikTok/Instagram links do.
          location.replace(intentUrl);
        }

        document.getElementById('copy').addEventListener('click', function () {
          var link = location.origin + location.pathname;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(link).then(function () { hint.textContent = 'Link copied'; });
          } else {
            hint.textContent = link;
          }
        });
      })();
    </script>
  </body>
</html>
