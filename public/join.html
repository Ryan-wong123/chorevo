<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join a Chorevo group</title>

    <!-- Served for /join/<code> (firebase.json rewrite). Group invite QR codes
         point here; with the app installed, App Links open the app directly. -->
    <meta name="description" content="You're invited to a private dance group on Chorevo.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Chorevo">
    <meta property="og:title" content="Join a dance group on Chorevo">
    <meta property="og:description" content="You're invited to a private dance group on Chorevo.">
    <meta property="og:image" content="https://chorevo-dea05.web.app/og-default.png">
    <meta name="robots" content="noindex">

    <style>
      :root { --accent: #ff3d6e; --bg: #0f0f14; --card: #1b1b24; --text: #f5f5f7; --muted: #a0a0ad; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: var(--bg); color: var(--text); font-family: Roboto, -apple-system, Helvetica, Arial, sans-serif; padding: 16px; }
      .card { width: 100%; max-width: 380px; background: var(--card); border-radius: 20px; padding: 32px 24px; text-align: center; }
      .logo { font-size: 28px; font-weight: 800; letter-spacing: .5px; margin: 0 0 8px; }
      .logo span { color: var(--accent); }
      .title { font-size: 20px; margin: 16px 0 8px; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 28px; letter-spacing: 4px;
              background: #0f0f14; border-radius: 12px; padding: 12px; margin: 0 0 16px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      .btn { display: block; width: 100%; padding: 14px; border-radius: 999px; border: 0; font-size: 16px; font-weight: 600;
             text-decoration: none; cursor: pointer; margin-bottom: 12px; }
      .primary { background: var(--accent); color: #fff; }
      .secondary { background: transparent; color: var(--text); border: 1px solid #3a3a48; }
      .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; min-height: 1em; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="logo">Chor<span>evo</span></h1>
      <h2 class="title">You're invited to a dance group</h2>
      <div id="code" class="code"></div>
      <p>Open Chorevo to join. Or open Groups in the app, tap the key icon and enter this code.</p>
      <a id="open" class="btn primary" href="#">Open in Chorevo</a>
      <button id="copy" class="btn secondary" type="button">Copy code</button>
      <p id="hint" class="hint"></p>
    </main>

    <script src="/js/join.js"></script>
  </body>
</html>
