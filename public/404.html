<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found | Chorevo</title>
    <meta name="description" content="Page not found.">
    <meta name="robots" content="noindex">
    <style>
      :root { --accent: #ff3d6e; --bg: #0f0f14; --card: #1b1b24; --text: #f5f5f7; --muted: #a0a0ad; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: var(--bg); color: var(--text); font-family: Roboto, -apple-system, Helvetica, Arial, sans-serif; padding: 16px; }
      .card { width: 100%; max-width: 520px; background: var(--card); border-radius: 20px; padding: 32px 24px; }
      .logo { font-size: 28px; font-weight: 800; letter-spacing: .5px; margin: 0 0 8px; text-align: center; }
      .logo span { color: var(--accent); }
      h2 { font-size: 20px; margin: 16px 0 8px; }
      h3 { font-size: 16px; margin: 20px 0 6px; }
      p, li { color: var(--muted); line-height: 1.55; }
      a { color: var(--accent); }
      .center { text-align: center; }
      .placeholder { border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 12px; color: var(--text); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="logo">Chor<span>evo</span></h1>
      <h2 class="center">Page not found</h2>
      <p class="center">This link doesn't lead anywhere. If someone shared a dance or an invite with you, ask them to send the link again.</p>
      <p class="center"><a href="/">Go to Chorevo</a></p>
    </main>
  </body>
</html>
