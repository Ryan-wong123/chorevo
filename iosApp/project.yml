# Generate the Xcode project with:  brew install xcodegen && cd iosApp && xcodegen
# (the generated iosApp.xcodeproj is not committed).
name: iosApp
options:
  bundleIdPrefix: com.example.chorevo
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The shared framework is built for arm64 devices and Apple Silicon simulators only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.chorevo
        PRODUCT_NAME: Chorevo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chorevo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Chorevo uses the camera to track your dance moves.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        CODE_SIGN_STYLE: Automatic
